apis:
  identity:
    root: src/identity.yaml
  customers:
    root: src/customers.yaml
  underwriting:
    root: src/underwriting.yaml
  guarantees:
    root: src/guarantees.yaml
  pricing:
    root: src/pricing.yaml
  forecasting:
    root: src/forecasting.yaml
  network:
    root: src/network.yaml
  diagnostics:
    root: src/diagnostics.yaml
  settlement:
    root: src/settlement.yaml
  advisory:
    root: src/advisory.yaml
  governance:
    root: src/governance.yaml

extends:
  - recommended

rules:
  security-defined: off
  operation-summary: warn
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
