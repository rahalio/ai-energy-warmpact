openapi: 3.1.0
info:
  title: Forecasting API schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    DataEnvelopeDemandForecast:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/DemandForecast'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    DemandForecast:
      type: object
      required:
      - horizonHours
      - points
      properties:
        connectionId:
          type: string
        networkZone:
          type: string
        horizonHours:
          type: integer
        points:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              demandKw:
                type: number
                format: float
              outdoorTemperatureC:
                type: number
                format: float
              occupancyFactor:
                type: number
                format: float
        meanAbsolutePercentageError:
          type: number
          format: float
        modelVersion:
          type: string
